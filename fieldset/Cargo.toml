[package]
name = "fieldset"
description = "Typed field paths and change tracking for plain structs"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf"]

[dependencies]
fieldset_macro = { version = "=0.2.0", path = "../fieldset-macro" }

[dev-dependencies]
divan = "0.1.21"
proptest = "1.12.0"
trybuild = "1.0.122"

[[bench]]
name = "drain"
harness = false
